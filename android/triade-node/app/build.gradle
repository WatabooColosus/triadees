plugins {
    id "com.android.application"
}

android {
    namespace "local.triade.node"
    compileSdk 35

    defaultConfig {
        applicationId "local.triade.node"
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName "0.10.2"
    }

    signingConfigs {
        release {
            // Keystore local del operador; nunca se versiona.
            storeFile file("triade-release.jks")
            storePassword project.findProperty("TRIADE_STORE_PASSWORD") ?: System.getenv("TRIADE_STORE_PASSWORD")
            keyAlias project.findProperty("TRIADE_KEY_ALIAS") ?: (System.getenv("TRIADE_KEY_ALIAS") ?: "triade")
            keyPassword project.findProperty("TRIADE_KEY_PASSWORD") ?: System.getenv("TRIADE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
