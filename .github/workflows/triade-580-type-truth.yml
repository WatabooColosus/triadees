name: Triade 5.8 type-truth fast gate

on:
  push:
    branches:
      - fix/triade-580-audit-safe-20261022
    paths:
      - triade/**
      - .github/workflows/triade-580-type-truth.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and static analysis
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install ruff mypy types-setuptools
      - name: Python compilation
        run: python -m compileall -q triade apps scripts tests
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Global mypy (unchanged strict gate)
        shell: bash
        run: |
          set -o pipefail
          mypy triade 2>&1 | tee mypy-report.txt
      - name: Upload type audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triade-type-truth-${{ matrix.python-version }}-${{ github.sha }}
          path: mypy-report.txt
          if-no-files-found: ignore
          retention-days: 10
