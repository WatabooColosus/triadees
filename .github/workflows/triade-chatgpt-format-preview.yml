name: ChatGPT Bridge Format Preview
on:
  push:
    paths:
      - ".github/workflows/triade-chatgpt-format-preview.yml"
jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install ruff
      - run: ruff format apps/chatgpt_actions_app.py tests/test_chatgpt_actions_app.py
      - name: Export formatted sources for review (encoded, no credentials)
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          for name in ('apps/chatgpt_actions_app.py', 'tests/test_chatgpt_actions_app.py'):
              encoded = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              print('FORMATTED_FILE|' + name + '|' + encoded)
          PY
