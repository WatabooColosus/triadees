name: Tríade Colab Live Audit

on:
  push:
    branches:
      - fix/triade-580-audit-safe-20261022
    paths:
      - tools/colab_live_audit.py
      - tests/test_colab_live_audit.py
      - .github/workflows/triade-colab-live-audit.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aggregate-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install ruff
      - name: Style and syntax
        run: |
          ruff check tools/colab_live_audit.py tests/test_colab_live_audit.py
          ruff format --check tools/colab_live_audit.py tests/test_colab_live_audit.py
          python -m compileall -q tools/colab_live_audit.py tests/test_colab_live_audit.py
      - name: Private telemetry regression
        run: pytest -q tests/test_colab_live_audit.py
