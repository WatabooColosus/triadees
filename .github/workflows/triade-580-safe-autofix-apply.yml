name: Triade 5.8.0 safe remediation apply

# Single-run, branch-restricted, explicit automated patch; NEVER merges or publishes releases.
on:
  push:
    branches:
      - fix/triade-580-audit-safe-20261022
    paths:
      - .github/workflows/triade-580-safe-autofix-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/fix/triade-580-audit-safe-20261022'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Safe Ruff auto-fix only
        run: |
          python -m pip install ruff
          ruff check --fix . || true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Non-breaking npm audit fix only
        run: |
          cd frontend
          npm ci --no-fund
          npm audit fix --no-fund
          npm audit --audit-level=high
      - name: Review diff and refuse generated build output
        run: |
          git restore frontend/dist || true
          git diff --check
          git diff --stat
      - name: Commit auditable changes only to candidate branch
        run: |
          git config user.name 'triade-ci-safe-fix'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style/security: apply safe Ruff auto-fixes and patched frontend lockfile'
            git push origin HEAD:fix/triade-580-audit-safe-20261022
          fi
