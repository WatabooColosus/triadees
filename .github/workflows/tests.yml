name: Tríade Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Only the newest run for this workflow, event type and ref is useful.
  # Separate push and PR contexts, and preserve all validation steps.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q
