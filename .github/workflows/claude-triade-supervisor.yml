name: Claude · Supervisor externo de Tríade

on:
  workflow_dispatch:
    inputs:
      mission:
        description: Misión concreta del ciclo de supervisión
        required: false
        default: Ejecuta el supervisor externo de Tríade sobre el estado actual y trabaja una sola brecha prioritaria.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  supervise:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body, '@claude supervisa triade') ||
      contains(github.event.comment.body, '@claude ejecuta el supervisor externo')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute external supervisor
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >-
            Lee CLAUDE.md y .claude/agents/triade-external-supervisor.md completos.
            Actúa exclusivamente como supervisor externo de Tríade Ω.
            No simules datos ni modifiques memoria o bases vivas.
            Genera los grafos reales, contrasta el PR o rama actual, selecciona una sola
            brecha prioritaria, implementa el cambio mínimo en una rama aislada, ejecuta
            pruebas y deja evidencia, rollback y recomendación humana.
            Misión solicitada: ${{ inputs.mission || github.event.comment.body }}
          claude_args: |
            --max-turns 30
