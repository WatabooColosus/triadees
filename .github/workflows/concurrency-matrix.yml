name: Concurrency Matrix

# Por qué existe este workflow
# ---------------------------
# La concurrencia gobernada estuvo APAGADA por defecto: al activarla,
# `test_worker_learning_integration` pasó de verde en `main` a rojo en la rama, y
# el fallo no se reprodujo localmente. Un fallo que no se entiende no se activa
# por defecto, y este workflow existía para poder observarlo donde ocurre.
#
# ENCENDIDA POR DEFECTO desde el 2026-08-01, porque ese diagnóstico dio su
# resultado y no era el que se creía. En los seis trabajos concurrentes
# (py3.11 ×3 y py3.12 ×3) el paso de pytest terminó al 100 %,
# `test_worker_learning_integration` incluido. Lo único rojo era el paso
# siguiente, `Governed concurrency validation on a database copy`, y por una
# razón sin relación con la concurrencia: una de sus comprobaciones exigía que
# la copia conservara `verification_reports` REALES, y un runner limpio no tiene
# ninguno. Imposible de cumplir en CI. Ese rojo permanente se venía atribuyendo
# al test de aprendizaje sin comprobarlo — el daño exacto que hace un rojo que
# nadie mira. Corregido: la comprobación verifica ahora que la copia sea FIEL
# —propiedad del código— y se declara "no aplicable" cuando el origen no tiene
# informes.
#
# Este workflow ejecuta el MISMO subconjunto de pruebas en las dos
# configuraciones, y ahora los dos trabajos BLOQUEAN:
#
#   TRIADE_WORKER_CONCURRENCY=1  ->  el modo que corre en producción
#   TRIADE_WORKER_CONCURRENCY=0  ->  la vuelta atrás, que también hay que probar
#
# Una vuelta atrás que no se prueba no es una vuelta atrás, es una esperanza.
#
# El trabajo concurrente se repite varias veces a propósito: una carrera que
# aparece una de cada cinco ejecuciones es indistinguible de "verde" si solo se
# mira una. Repetir es la única forma de convertir un fallo intermitente en
# evidencia.

on:
  push:
    paths:
      - "triade/workers/**"
      - "triade/runtime/**"
      - "triade/metabolism/**"
      - "tests/test_metabolism.py"
      - "tests/test_worker*"
      - "tests/test_*concurrency*"
      - "tests/test_*lease*"
      - ".github/workflows/concurrency-matrix.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Subconjunto sensible al modo de ejecución. Incluye el test que rompió
  # (`test_worker_learning_integration`) para que su fallo vuelva a verse aquí,
  # aislado y repetible, en vez de mezclado con 1500 pruebas más.
  # `tests/test_metabolism.py` entra aquí porque contiene
  # `test_concurrent_status_calls`, el que colgaba la suite entera: diez hilos
  # martilleando `status()` mientras el coordinador vive. Estaba fuera de esta
  # matriz —nunca se ejecutó en los dos modos— y por eso su causa siguió
  # abierta tanto tiempo. Los dos trabajos bloquean, así que a partir de aquí
  # una regresión del metabolismo rompe el PR en cualquiera de los dos modos.
  RUNTIME_TESTS: >-
    tests/test_metabolism.py
    tests/test_worker_loop.py
    tests/test_worker_cli.py
    tests/test_worker_api.py
    tests/test_worker_learning_integration.py
    tests/test_worker_safety_blocks_identity_change.py
    tests/test_worker_concurrency_policy.py
    tests/test_worker_concurrency_pool.py
    tests/test_worker_loop_concurrency_integration.py
    tests/test_controlled_shutdown_live.py
    tests/test_worker_autostart_deadlock.py
    tests/test_runtime_task_leases.py
    tests/test_lease_fencing.py
    tests/test_atomic_completion.py
    tests/test_orphaned_task_recovery.py
    tests/test_uncertain_completion_leak.py

jobs:
  serial:
    name: runtime tests (serial, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run runtime tests without concurrency
        env:
          TRIADE_WORKER_CONCURRENCY: "0"
        run: pytest -q --durations=15 -o faulthandler_timeout=180 ${{ env.RUNTIME_TESTS }}

  concurrent:
    name: runtime tests (concurrent, py${{ matrix.python }} run ${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # BLOQUEA. Este trabajo dejó de ser diagnóstico el día que la concurrencia
    # se encendió por defecto (2026-08-01): a partir de ahí es el modo que corre
    # en producción, y un fallo aquí es un fallo de lo que se está ejecutando de
    # verdad. Se quitó `continue-on-error` en el mismo commit que invirtió el
    # defecto, porque lo contrario —encenderla y seguir tolerando rojo aquí— es
    # la peor de las dos combinaciones posibles.
    #
    # Las tres repeticiones siguen siendo el punto: una carrera que aparece una
    # de cada cinco ejecuciones es indistinguible de "verde" si sólo se mira una.
    strategy:
      fail-fast: false
      matrix:
        # Dos ejes a proposito. `attempt` distingue una carrera intermitente de
        # un fallo determinista; `python` aisla si la version es la causa. La
        # primera pasada fallo 3/3 en 3.11 y en local pasa en 3.12, asi que esa
        # es la hipotesis viva.
        attempt: [1, 2, 3]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Show the machine we are racing on
        # El fallo no se reprodujo en 8 CPU. Si depende del hardware del runner,
        # este dato es la primera pista.
        run: |
          nproc
          free -m || true
          python -c "import os; print('cpu_count:', os.cpu_count())"
      - name: Run runtime tests with governed concurrency
        env:
          TRIADE_WORKER_CONCURRENCY: "1"
        run: pytest -q --durations=15 -o faulthandler_timeout=180 ${{ env.RUNTIME_TESTS }}
      - name: Governed concurrency validation on a database copy
        if: always()
        env:
          TRIADE_WORKER_CONCURRENCY: "1"
        run: python scripts/run_concurrency_and_lease_validation.py
      - name: Keep the evidence when it breaks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-failure-py${{ matrix.python }}-${{ matrix.attempt }}
          path: |
            runs/
          retention-days: 7
          if-no-files-found: ignore

  verdict:
    name: concurrency verdict
    runs-on: ubuntu-latest
    needs: [serial, concurrent]
    if: always()
    steps:
      - name: Report what the matrix proved
        run: |
          echo "serial:     ${{ needs.serial.result }}"
          echo "concurrent: ${{ needs.concurrent.result }}"
          # Los DOS bloquean, y por razones distintas.
          #
          # `concurrent` es el modo que corre en producción desde que la
          # concurrencia se encendió por defecto (2026-08-01).
          #
          # `serial` es la vuelta atrás: se apaga con
          # `TRIADE_WORKER_CONCURRENCY=0`, sin desplegar código. Una vuelta
          # atrás que no se prueba no es una vuelta atrás, es una esperanza.
          test "${{ needs.serial.result }}" = "success"
          test "${{ needs.concurrent.result }}" = "success"
          echo "Los dos modos pasan: el que corre y aquel al que se puede volver."
