name: Runtime Truth CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip install ruff mypy pip-audit detect-secrets types-setuptools
      - name: Compile all Python
        run: python -m compileall -q triade apps scripts tests
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      # Antes de la suite larga: si la documentación contradice al código, la
      # señal tiene que llegar en segundos y no enterrada veinte minutos
      # después. Cuesta décimas y falla por afirmaciones comprobables —ficheros
      # citados que no existen, módulos retirados presentados como vivos,
      # Claude como parte de Tríade—, nunca por prosa.
      - name: Documentation drift
        run: pytest -q tests/test_docs_no_drift.py tests/test_manual_tools_doc.py
      - name: Full tests with coverage
        run: pytest -q --cov=triade --cov-report=xml --cov-report=term
      - name: Operational truth
        run: pytest -q tests/operational_truth
      - name: Reduced real concurrency
        run: >-
          python scripts/run_runtime_concurrency_test.py
          --output-dir "${{ runner.temp }}/triade-concurrency"
          --tasks 30 --workers 2
          --report "${{ runner.temp }}/concurrency-report.json"
      - name: Migration and rollback tests
        run: >-
          pytest -q tests/test_runtime_task_leases.py
          tests/test_lease_fencing.py tests/test_atomic_completion.py
          tests/test_governed_capability_rollback.py
      - name: SQLite integrity smoke check
        run: |
          python - <<'PY'
          import sqlite3
          import tempfile
          from pathlib import Path
          from triade.runtime.task_leases import AutonomousTaskStore

          root = Path(tempfile.mkdtemp(prefix="triade-ci-db-"))
          db = root / "runtime.db"
          AutonomousTaskStore(db)
          with sqlite3.connect(db) as conn:
              assert conn.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          PY
      - name: Global mypy gate
        shell: bash
        run: |
          set -o pipefail
          mypy triade 2>&1 | tee mypy-report.txt
      - name: Security gates
        run: >-
          pytest -q tests/test_public_security.py
          tests/test_federated_exchange.py
          tests/test_lora_serving_governance.py
          tests/test_encrypted_backup_recovery.py
      - name: Clean and historical migration gates
        run: >-
          pytest -q tests/test_migration_persistence.py
          tests/test_crystal_db_migration.py
          tests/test_runtime_task_leases.py
      - name: Python dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: detect-secrets scan --all-files --exclude-files '(^frontend/node_modules/|^runs/|\.db$)' > secret-scan.json
      - name: Verify clean generated diff
        run: git diff --exit-code
      - name: Upload runtime truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-truth-python-${{ matrix.python-version }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage.xml
            mypy-report.txt
            secret-scan.json
            ${{ runner.temp }}/concurrency-report.json

  frontend-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit

  required-result:
    if: always()
    needs: [python-truth, frontend-truth]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PYTHON_RESULT: ${{ needs.python-truth.result }}
          FRONTEND_RESULT: ${{ needs.frontend-truth.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$FRONTEND_RESULT" = success
