name: Cloud Foundation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # Only the newest run for this workflow, event type and ref is useful.
  # Separate push and PR contexts, and preserve all validation steps.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Compose interpolation reads the job environment, not env_file. These
      # values are ephemeral test credentials and are never deployment secrets.
      POSTGRES_PASSWORD: triade-ci-ephemeral-password
      TRIADE_DOMAIN: triade-ci.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare environment
        run: cp .env.cloud.example .env.cloud

      - name: Validate Compose
        run: docker compose -f compose.cloud.yml config

      - name: Build cloud runtime
        run: docker build -f Dockerfile.cloud -t triade-omega/cloud:ci .

      - name: Start and wait for dependencies
        run: docker compose -f compose.cloud.yml up -d --wait --wait-timeout 120 postgres valkey

      - name: Show dependency state
        run: docker compose -f compose.cloud.yml ps

      - name: Start API
        run: docker compose -f compose.cloud.yml up -d --wait --wait-timeout 180 triade-api

      - name: Verify health endpoints
        run: |
          docker compose -f compose.cloud.yml exec -T triade-api python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from apps.routes.health import ready, build_deep_runtime_health

          # Health-liveness can be public; deep operational state is protected.
          with urllib.request.urlopen("http://127.0.0.1:8010/health/live", timeout=15) as response:
              payload = json.load(response)
              assert response.status == 200
              assert payload.get("status") == "alive"

          for protected_path in ("/health/ready", "/health/deep"):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8010" + protected_path, timeout=15)
              except urllib.error.HTTPError as error:
                  assert error.code in {401, 403}, (protected_path, error.code)
              else:
                  raise AssertionError("protected_health_endpoint_exposed: " + protected_path)

          # Inside the trusted container, verify readiness and deep health
          # without weakening bearer authentication on the public surface.
          response = ready()
          assert response.status_code == 200, response.body.decode()
          deep = build_deep_runtime_health()
          assert deep.get("status") in {"ok", "degraded"}, deep
          print("/health/live: alive; ready: ready; deep:", deep.get("status"))
          PY

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f compose.cloud.yml ps || true
          docker compose -f compose.cloud.yml logs --no-color --tail=200 postgres valkey triade-api || true

      - name: Shutdown
        if: always()
        run: docker compose -f compose.cloud.yml down -v
