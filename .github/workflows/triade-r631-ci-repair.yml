name: Tríade R6.3.1 · CI repair of integrated sources

on:
  push:
    branches:
      - codex/triade-colab-r631-persistent-boot-20261025
    paths:
      - .github/workflows/triade-r631-ci-repair.yml

permissions:
  contents: write

jobs:
  repair-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.14.6'
      - name: Apply only automated safe lint and formatting fixes to R6 files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            triade/core/verified_run_mission_bridge.py
            triade/neurons/functional_evidence.py
            tests/test_verified_run_mission_bridge.py
            tests/test_neuron_functional_evidence.py
            tools/triade_colab_continuity_r631.py
            tools/triade_colab_r62_updater.py
            tools/triade_colab_r63_updater.py
            tools/triade_r63_probe.py
            tools/triade_r631_apply.py
            tools/triade_r631_recover.py
            tools/triade_integral_r6.py
            tools/triade_update_center.py
            tools/triade_r631_style_repair.py
          )
          present=()
          for path in "${files[@]}"; do
            if [[ -f "$path" ]]; then present+=("$path"); fi
          done
          files=("${present[@]}")
          python tools/triade_r631_style_repair.py "${files[@]}"
          python -m ruff check --select I001,UP022,UP017,RUF059,SIM117,RUF015 --fix "${files[@]}" || true
          python -m ruff check --fix "${files[@]}" || true
          python -m ruff format "${files[@]}"
          python -m compileall -q "${files[@]}"
          git diff --check
          git status --short
          git config user.name 'triade-ci-repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          if ! git diff --cached --quiet; then
            git commit -m 'style(r63): fix imports and formatting for full CI'
            git push origin HEAD:codex/triade-colab-r631-persistent-boot-20261025
          fi
      - name: Report remaining lint and tests
        run: |
          python -m ruff check triade/core/verified_run_mission_bridge.py triade/neurons/functional_evidence.py tests/test_verified_run_mission_bridge.py tests/test_neuron_functional_evidence.py tools/triade_colab_continuity_r631.py tools/triade_colab_r63_updater.py tools/triade_r63_probe.py tools/triade_r631_apply.py tools/triade_r631_recover.py tools/triade_integral_r6.py tools/triade_update_center.py tools/triade_r631_style_repair.py
