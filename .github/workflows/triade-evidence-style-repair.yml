name: Scoped Evidence Style Repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format-evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/autonomous-ab-failure-gates-20261101'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format only new evidence source and tests
        run: |
          python -m pip install --disable-pip-version-check ruff==0.17.3
          ruff check --fix tools/triade_colab_evidence_continuity.py tests/test_colab_evidence_continuity.py
          ruff format tools/triade_colab_evidence_continuity.py tests/test_colab_evidence_continuity.py
          ruff check tools/triade_colab_evidence_continuity.py tests/test_colab_evidence_continuity.py
      - name: Push scoped formatting changes
        run: |
          git add tools/triade_colab_evidence_continuity.py tests/test_colab_evidence_continuity.py
          if ! git diff --cached --quiet; then
            git config user.name 'triade-ci-style'
            git config user.email 'triade-style@users.noreply.github.com'
            git commit -m 'style(colab): format immutable evidence continuity'
            git push origin HEAD:refs/heads/feat/autonomous-ab-failure-gates-20261101
          fi
