# Separate service: never replaces the currently deployed Tríade or its Bodega.
services:
  - type: web
    name: triade-omega-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-mcp.txt
    startCommand: uvicorn apps.chatgpt_mcp_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TRIADE_ACTIONS_TOKEN
        generateValue: true
      - key: TRIADE_ACTIONS_UPSTREAM_URL
        sync: false
      - key: TRIADE_ACTIONS_UPSTREAM_KEY
        sync: false
      - key: TRIADE_ACTIONS_ALLOW_RUN
        value: "0"
