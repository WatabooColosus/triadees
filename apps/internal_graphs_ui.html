<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tríade Ω · Grafos internos vivos</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#11182a;--line:#26314a;--text:#ecf1ff;--muted:#9da9c4;--ok:#44d17a;--bad:#ff6474;--warn:#f6c453;--crypt:#9c83ff;--accent:#5eb8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}.shell{display:grid;grid-template-rows:auto 1fr;height:100vh}.top{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#0d1322}.top h1{font-size:16px;margin:0}.badge{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.live{color:var(--ok)}.layout{display:grid;grid-template-columns:280px 1fr 340px;min-height:0}.side,.detail{overflow:auto;padding:12px;background:var(--panel)}.side{border-right:1px solid var(--line)}.detail{border-left:1px solid var(--line)}.main{position:relative;overflow:hidden}.controls{display:grid;gap:8px;margin-bottom:12px}input,select,button{width:100%;background:#0b1120;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}button{cursor:pointer;text-align:left}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tabs button.active{border-color:var(--accent);color:var(--accent)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.metric{padding:10px;border:1px solid var(--line);border-radius:10px;background:#0d1424}.metric b{display:block;font-size:20px}.tree{display:grid;gap:6px}.node-row{display:flex;gap:8px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}.active .dot{background:var(--ok)}.failed .dot{background:var(--bad)}.protected .dot,.hidden .dot{background:var(--crypt)}.unknown .dot{background:var(--warn)}svg{width:100%;height:100%;background:radial-gradient(circle at center,#121b30,#090d18 70%)}line{stroke:#33415f;stroke-width:1.2}.g-node circle{stroke:#0b1020;stroke-width:2}.g-node text{fill:var(--text);font-size:11px;pointer-events:none}.g-node{cursor:pointer}.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0c1322;margin-bottom:10px}.kv{display:grid;grid-template-columns:110px 1fr;gap:6px;margin:6px 0}.kv span:first-child{color:var(--muted)}pre{white-space:pre-wrap;word-break:break-word;color:#cbd6f4}.alert{color:var(--bad)}@media(max-width:980px){.layout{grid-template-columns:230px 1fr}.detail{position:absolute;right:0;top:57px;bottom:0;width:330px;z-index:5;box-shadow:-10px 0 30px #0008}.detail.closed{display:none}}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:none}.detail{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><h1>Tríade Ω · sistema vivo</h1><span id="connection" class="badge">conectando</span><span id="stamp" class="badge"></span></header>
<div class="layout">
<aside class="side">
<div class="controls"><input id="search" placeholder="Buscar archivo, tabla, run, neurona…"><div class="tabs"><button id="physicalTab" class="active">Sistema físico</button><button id="neuralTab">Grafo neural</button></div><select id="stateFilter"><option value="all">Todos los estados</option><option value="active">Activos</option><option value="failed">Fallidos</option><option value="protected">Protegidos</option><option value="unknown">Desconocidos</option></select></div>
<div class="metrics"><div class="metric"><span>Nodos</span><b id="nodesCount">0</b></div><div class="metric"><span>Conexiones</span><b id="edgesCount">0</b></div><div class="metric"><span>CPU proceso</span><b id="cpu">0</b></div><div class="metric"><span>RAM máx.</span><b id="ram">0</b></div></div>
<div id="tree" class="tree"></div>
</aside>
<main class="main"><svg id="graph" viewBox="0 0 1200 800" role="img" aria-label="Grafo interactivo del sistema Tríade"></svg></main>
<aside id="detail" class="detail"><div class="card"><b>Fuente</b><div class="kv"><span>Simulado</span><span id="simulated">—</span></div><div class="kv"><span>Base</span><span id="dbHealth">—</span></div><div class="kv"><span>Tablas</span><span id="dbTables">—</span></div></div><div id="selected" class="card"><b>Selecciona un nodo</b><p style="color:var(--muted)">Haz clic para ver metadatos, conexiones y evidencia.</p></div><div id="relations"></div></aside>
</div></div>
<script>
const svg=document.getElementById('graph'),tree=document.getElementById('tree'),selected=document.getElementById('selected'),relations=document.getElementById('relations');let snapshot=null,mode='physical';
const color=s=>s==='active'?'#44d17a':s==='failed'?'#ff6474':(s==='protected'||s==='hidden')?'#9c83ff':s==='legacy'?'#6f7892':'#f6c453';
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function current(){return snapshot?snapshot[mode]:{nodes:[],edges:[]}}
function filtered(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('stateFilter').value;return current().nodes.filter(n=>(f==='all'||n.state===f)&&(`${n.label} ${n.kind} ${n.node_id}`).toLowerCase().includes(q)).slice(0,700)}
function draw(){if(!snapshot)return;const data=current(),nodes=filtered(),ids=new Set(nodes.map(n=>n.node_id)),edges=data.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)).slice(0,1800);document.getElementById('nodesCount').textContent=nodes.length;document.getElementById('edgesCount').textContent=edges.length;tree.innerHTML='';nodes.slice(0,180).forEach(n=>{const b=document.createElement('button');b.className=`node-row ${n.state}`;b.innerHTML=`<span class="dot"></span><span>${escapeHtml(n.label)}</span>`;b.onclick=()=>inspect(n);tree.appendChild(b)});const W=1200,H=800,cx=W/2,cy=H/2,r=Math.min(W,H)*.42,pos=new Map();nodes.forEach((n,i)=>{const ring=1+Math.floor(i/90),a=(i%90)/90*Math.PI*2+ring*.3,rr=Math.min(r,90+ring*72);pos.set(n.node_id,{x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr})});svg.innerHTML='';edges.forEach(e=>{const a=pos.get(e.source),b=pos.get(e.target);if(!a||!b)return;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);svg.appendChild(l)});nodes.forEach(n=>{const p=pos.get(n.node_id),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','g-node');const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',n.kind==='directory'||n.kind==='table'?9:6);c.setAttribute('fill',color(n.state));const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',p.x+10);t.setAttribute('y',p.y+4);t.textContent=n.label.length>34?n.label.slice(0,31)+'…':n.label;g.append(c,t);g.onclick=()=>inspect(n);svg.appendChild(g)})}
function inspect(n){const data=current(),out=data.edges.filter(e=>e.source===n.node_id||e.target===n.node_id).slice(0,80);selected.innerHTML=`<b>${escapeHtml(n.label)}</b><div class="kv"><span>ID</span><span>${escapeHtml(n.node_id)}</span></div><div class="kv"><span>Tipo</span><span>${escapeHtml(n.kind)}</span></div><div class="kv"><span>Estado</span><span>${escapeHtml(n.state)}</span></div><pre>${escapeHtml(JSON.stringify(n.metadata,null,2))}</pre>`;relations.innerHTML='<div class="card"><b>Conexiones y evidencia</b>'+out.map(e=>`<div class="kv"><span>${escapeHtml(e.relation)}</span><span>${escapeHtml(e.source===n.node_id?e.target:e.source)}<br><small>${escapeHtml(e.evidence)}</small></span></div>`).join('')+'</div>'}
function update(s){snapshot=s;document.getElementById('connection').textContent='EN VIVO';document.getElementById('connection').className='badge live';document.getElementById('stamp').textContent=new Date(s.generated_at*1000).toLocaleTimeString();document.getElementById('simulated').textContent=String(s.source.simulated);document.getElementById('dbHealth').textContent=s.database.integrity;document.getElementById('dbTables').textContent=s.database.tables??'—';document.getElementById('cpu').textContent=(s.resources.process_cpu_seconds??0)+'s';document.getElementById('ram').textContent=Math.round((s.resources.process_max_rss_kb??0)/1024)+'MB';draw()}
const es=new EventSource('/api/internal-graphs/stream');es.addEventListener('snapshot',e=>update(JSON.parse(e.data)));es.addEventListener('graph_error',e=>{document.getElementById('connection').textContent='ERROR REAL';document.getElementById('connection').className='badge alert';console.error(JSON.parse(e.data))});es.onerror=()=>{document.getElementById('connection').textContent='RECONECTANDO'};
document.getElementById('search').oninput=draw;document.getElementById('stateFilter').onchange=draw;document.getElementById('physicalTab').onclick=()=>{mode='physical';document.getElementById('physicalTab').className='active';document.getElementById('neuralTab').className='';draw()};document.getElementById('neuralTab').onclick=()=>{mode='neural';document.getElementById('neuralTab').className='active';document.getElementById('physicalTab').className='';draw()};
</script>
</body></html>
