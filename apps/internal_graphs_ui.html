<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tríade Ω · Grafos internos</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --fg: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid; grid-template-rows: auto 1fr; height: 100vh;
  }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0 0 8px; font-weight: 600; }
  h1 small { color: var(--muted); font-weight: 400; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; }
  nav button {
    background: #21262d; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  nav button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  main { display: grid; grid-template-columns: 1fr 340px; overflow: hidden; }
  #canvas-wrap { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  circle.node { stroke-width: 1.5px; cursor: pointer; }
  circle.node.dim { opacity: 0.12; }
  circle.node.sel { stroke: #fff; stroke-width: 3px; }
  circle.node.signal { animation: pulse .9s ease-out; }
  @keyframes pulse { from { r: 18; opacity: .35; } to { r: 11; opacity: 1; } }
  line.edge { stroke: #484f58; stroke-width: 0.6px; }
  line.edge.hot { stroke: var(--accent); stroke-width: 2px; }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  h2 { font-size: 13px; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; vertical-align: top; word-break: break-word; }
  td:first-child { color: var(--muted); width: 38%; padding-right: 8px; }
  .edge-item { font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .edge-item code { color: var(--accent); }
  .status { font-size: 11px; color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Tríade Ω · grafos internos <small id="status" class="status">conectando…</small></h1>
  <nav id="tabs"></nav>
  <div class="legend" id="legend"></div>
</header>
<main>
  <div id="canvas-wrap"><svg id="canvas"></svg></div>
  <aside>
    <div class="counts" id="counts"></div>
    <div id="detail"><p class="empty">Selecciona un nodo para ver su interior.</p></div>
  </aside>
</main>
<script>
"use strict";
// El explorador no interpreta nada: pinta el estado y el color que el backend
// ya calculó desde código y base real. Si un dato no viene, se muestra vacío,
// nunca se rellena.
const GRAPHS = ["organs","vital_chain","workers","tables","entrypoints","imports","calls","neural","physical"];
const NAMES = {
  organs:"Órganos", vital_chain:"Cadena vital", workers:"Workers y tareas",
  tables:"Tablas SQLite", entrypoints:"Entrypoints", imports:"Módulos e imports",
  calls:"Llamadas", neural:"Runtime neural", physical:"Atlas físico"
};
const NODE_CAP = 1200; // por encima de esto el navegador deja de responder

const svg = document.getElementById("canvas");
const NS = "http://www.w3.org/2000/svg";
let current = "organs", data = null, selected = null;
let view = { x: 0, y: 0, k: 1 };

function el(name, attrs) {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
}

function layout(nodes, edges) {
  // Disposición determinista: mismo grafo, misma imagen. Se agrupa por estado
  // en anillos, de modo que lo desconectado queda visualmente separado.
  const groups = {};
  nodes.forEach(n => (groups[n.state] = groups[n.state] || []).push(n));
  const states = Object.keys(groups).sort();
  const pos = new Map();
  const W = svg.clientWidth || 900, H = svg.clientHeight || 600;
  states.forEach((state, si) => {
    const list = groups[state];
    const radius = 70 + si * 105;
    list.forEach((n, i) => {
      const angle = (i / list.length) * Math.PI * 2 + si * 0.4;
      pos.set(n.node_id, { x: W / 2 + Math.cos(angle) * radius, y: H / 2 + Math.sin(angle) * radius });
    });
  });
  return pos;
}

function render() {
  svg.innerHTML = "";
  if (!data) return;
  const nodes = data.nodes.slice(0, NODE_CAP);
  const shown = new Set(nodes.map(n => n.node_id));
  const edges = data.edges.filter(e => shown.has(e.source) && shown.has(e.target));
  const pos = layout(nodes, edges);
  const g = el("g", { transform: `translate(${view.x},${view.y}) scale(${view.k})` });

  for (const e of edges) {
    const a = pos.get(e.source), b = pos.get(e.target);
    if (!a || !b) continue;
    const hot = selected && (e.source === selected || e.target === selected);
    const line = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: "edge" + (hot ? " hot" : "") });
    g.appendChild(line);
  }
  for (const n of nodes) {
    const p = pos.get(n.node_id);
    if (!p) continue;
    const dim = selected && n.node_id !== selected &&
      !edges.some(e => (e.source === selected && e.target === n.node_id) ||
                       (e.target === selected && e.source === n.node_id));
    const hit = flashing.has(n.node_id);
    const c = el("circle", {
      cx: p.x, cy: p.y, r: hit ? 11 : 6, fill: n.color,
      stroke: hit ? "#fff" : "#0d1117",
      class: "node" + (dim ? " dim" : "") + (n.node_id === selected ? " sel" : "") +
             (hit ? " signal" : "")
    });
    c.addEventListener("click", ev => { ev.stopPropagation(); select(n.node_id); });
    const title = el("title", {});
    title.textContent = `${n.label} · ${n.state}`;
    c.appendChild(title);
    g.appendChild(c);
  }
  svg.appendChild(g);
  if (data.nodes.length > NODE_CAP) {
    setStatus(`mostrando ${NODE_CAP} de ${data.nodes.length} nodos · recorte declarado`);
  }
}

function setStatus(text) { document.getElementById("status").textContent = text; }

function renderCounts() {
  const box = document.getElementById("counts");
  box.innerHTML = "";
  if (!data) return;
  for (const [state, n] of Object.entries(data.states).sort((a, b) => b[1] - a[1])) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `<span class="dot" style="background:${colorOf(state)}"></span> ${state}: ${n}`;
    box.appendChild(chip);
  }
}

let LEGEND = [];
function colorOf(state) {
  const hit = LEGEND.find(l => l.state === state);
  return hit ? hit.color : "#5a5a5a";
}

async function select(nodeId) {
  selected = nodeId;
  render();
  const box = document.getElementById("detail");
  box.innerHTML = "<p class='empty'>Leyendo…</p>";
  const res = await fetch(`/api/internal-graphs/node/${current}?node_id=${encodeURIComponent(nodeId)}`);
  if (!res.ok) { box.innerHTML = "<p class='empty'>Sin detalle.</p>"; return; }
  const d = await res.json();
  const rows = Object.entries(d.node.metadata || {})
    .map(([k, v]) => `<tr><td>${k}</td><td>${escapeHtml(String(v))}</td></tr>`).join("");
  const edgeList = [...d.outgoing.map(e => ({ ...e, dir: "→" })), ...d.incoming.map(e => ({ ...e, dir: "←" }))]
    .slice(0, 60)
    .map(e => `<div class="edge-item">${e.dir} <b>${escapeHtml(e.relation)}</b><br>
      ${escapeHtml(e.dir === "→" ? e.target : e.source)}<br><code>${escapeHtml(e.evidence)}</code></div>`).join("");
  box.innerHTML = `
    <h2>${escapeHtml(d.node.label)}</h2>
    <p><span class="dot" style="background:${d.node.color}"></span> <b>${d.node.state}</b>
       · ${d.degree.out} salientes / ${d.degree.in} entrantes</p>
    <table>${rows || "<tr><td class='empty'>sin metadatos</td><td></td></tr>"}</table>
    <h2>Conexiones y evidencia</h2>
    ${edgeList || "<p class='empty'>Nodo sin aristas: está aislado.</p>"}`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function load(name) {
  current = name; selected = null;
  setStatus("cargando " + NAMES[name] + "…");
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.g === name)));
  const res = await fetch(`/api/internal-graphs/graph/${name}`);
  data = await res.json();
  setStatus(`${data.nodes.length} nodos · ${data.edges.length} aristas`);
  renderCounts(); render();
  document.getElementById("detail").innerHTML = "<p class='empty'>Selecciona un nodo para ver su interior.</p>";
}

function buildTabs() {
  const nav = document.getElementById("tabs");
  const debt = document.createElement("button");
  debt.textContent = "⚠ Dónde se rompe";
  debt.dataset.g = "debt";
  debt.addEventListener("click", loadDebt);
  nav.appendChild(debt);
  for (const g of GRAPHS) {
    const b = document.createElement("button");
    b.textContent = NAMES[g]; b.dataset.g = g;
    b.addEventListener("click", () => load(g));
    nav.appendChild(b);
  }
}

// La deuda no es un grafo: es la lista de lo que está roto, con su evidencia y
// ejemplos concretos para poder ir a mirarlo.
async function loadDebt() {
  document.querySelectorAll("#tabs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.g === "debt")));
  svg.innerHTML = "";
  setStatus("midiendo deuda…");
  const res = await fetch("/api/internal-graphs/debt");
  const d = await res.json();
  const box = document.getElementById("detail");
  if (d.status !== "measured") {
    box.innerHTML = `<p class="empty">No medible: ${escapeHtml(d.reason || "")}. ` +
      `Genera los grafos con <code>python scripts/build_internal_graphs.py</code>.</p>`;
    setStatus("sin grafos generados");
    document.getElementById("counts").innerHTML = "";
    return;
  }
  const entries = Object.entries(d.items).sort((a, b) => b[1].count - a[1].count);
  document.getElementById("counts").innerHTML =
    `<span class="chip"><b>${d.debt_items_total}</b> elementos de deuda</span>` +
    `<span class="chip">grafos de hace ${Math.round(d.graphs_age_seconds / 60)} min</span>`;
  box.innerHTML = `<h2>Deuda estructural</h2>` + entries.map(([name, e]) => `
    <div class="edge-item">
      <b>${escapeHtml(name.replace(/_/g, " "))}</b> — ${e.count}<br>
      <code>${escapeHtml(e.evidence)}</code>
      ${e.sample.length ? "<br>" + e.sample.map(s => escapeHtml(s)).join("<br>") : ""}
    </div>`).join("");
  // Se pintan como barras: la longitud es el recuento, no una estimación.
  const max = Math.max(...entries.map(([, e]) => e.count), 1);
  const g = el("g", { transform: "translate(40,40)" });
  entries.forEach(([name, e], i) => {
    const w = (e.count / max) * Math.max(200, (svg.clientWidth || 700) - 260);
    const bar = el("rect", {
      x: 0, y: i * 46, width: Math.max(w, 2), height: 26, rx: 4,
      fill: e.count ? colorOf("disconnected") : colorOf("active")
    });
    g.appendChild(bar);
    const label = el("text", { x: 6, y: i * 46 + 18, fill: "#fff", "font-size": 12 });
    label.textContent = `${e.count}  ${name.replace(/_/g, " ")}`;
    g.appendChild(label);
  });
  svg.appendChild(g);
  setStatus(`${d.debt_items_total} elementos de deuda medidos`);
}

function buildLegend(legend) {
  LEGEND = legend;
  const box = document.getElementById("legend");
  box.innerHTML = "";
  for (const l of legend) {
    const s = document.createElement("span");
    s.innerHTML = `<span class="dot" style="background:${l.color}"></span> ${l.state} — ${l.meaning}`;
    box.appendChild(s);
  }
}

// Zoom y arrastre: el atlas no cabe en una pantalla y hay que poder recorrerlo.
let drag = null;
svg.addEventListener("mousedown", e => (drag = { x: e.clientX - view.x, y: e.clientY - view.y }));
window.addEventListener("mouseup", () => (drag = null));
window.addEventListener("mousemove", e => {
  if (!drag) return;
  view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; render();
});
svg.addEventListener("wheel", e => {
  e.preventDefault();
  view.k = Math.min(6, Math.max(0.15, view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  render();
}, { passive: false });
svg.addEventListener("click", () => { selected = null; render(); });

// Reactividad: cada pulso trae las señales vivas de SQLite y repinta los nodos
// cuyo estado cambió. La estructura no se recarga —no cambia entre pulsos—, lo
// que cambia es si un eslabón late, si una tarea se ejecutó, si una tabla creció.
const flashing = new Set();

function applySignals(signals) {
  if (!data) return false;
  let changed = false;
  for (const node of data.nodes) {
    let live = null;
    if (current === "vital_chain" && node.node_id.startsWith("stage:")) {
      live = signals.stages[node.label];
    } else if (current === "workers" && node.node_id.startsWith("task_type:")) {
      live = signals.task_types[node.label];
      if (live) node.metadata.executions = live.executions;
    } else if (current === "tables" && node.node_id.startsWith("table:")) {
      const rows = signals.tables[node.label];
      if (rows !== undefined && node.metadata.rows !== rows) {
        node.metadata.rows = rows; changed = true;
      }
      continue;
    }
    if (!live) continue;
    if (live.rows !== undefined) node.metadata.rows = live.rows;
    if (live.recent_24h !== undefined) node.metadata.recent_24h = live.recent_24h;
    if (live.state && live.state !== node.state) {
      node.state = live.state;
      node.color = colorOf(live.state);
      flashing.add(node.node_id);
      changed = true;
    }
  }
  if (changed) {
    const counts = {};
    for (const n of data.nodes) counts[n.state] = (counts[n.state] || 0) + 1;
    data.states = counts;
  }
  return changed;
}

function connect() {
  const source = new EventSource("/api/internal-graphs/stream");
  source.addEventListener("pulse", ev => {
    const p = JSON.parse(ev.data);
    if (!LEGEND.length) buildLegend(p.legend);
    const changed = applySignals(p.signals);
    renderCounts();
    if (changed) { render(); setTimeout(() => { flashing.clear(); render(); }, 900); }
    if (selected) refreshSelected(p.signals);
    const load = (p.resources.load_average || [0])[0];
    const stamp = new Date(p.generated_at * 1000).toLocaleTimeString();
    setStatus(`vivo ${stamp} · ${p.database.tables} tablas · integridad ${p.database.integrity} · carga ${load.toFixed(2)}`);
  });
  source.addEventListener("graph_error", ev => setStatus("error: " + JSON.parse(ev.data).error));
  source.onerror = () => setStatus("stream desconectado · reintentando");
}

function refreshSelected(signals) {
  const node = data.nodes.find(n => n.node_id === selected);
  if (!node) return;
  const live = current === "vital_chain" ? signals.stages[node.label]
             : current === "workers" ? signals.task_types[node.label] : null;
  if (!live) return;
  const box = document.querySelector("#detail table");
  if (box) select(selected);
}

buildTabs();
fetch("/api/internal-graphs/graph/organs").then(r => r.json()).then(d => {
  data = d; renderCounts(); render();
  document.querySelector("#tabs button").setAttribute("aria-pressed", "true");
  setStatus(`${d.nodes.length} nodos · ${d.edges.length} aristas`);
  connect();
});
</script>
</body>
</html>
