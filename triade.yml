models:
  provider: ollama
  base_url: http://127.0.0.1:11434
  timeout: 180
  fallback_enabled: true
  roles:
    hypothalamus: qwen2.5:3b-instruct
    central: qwen2.5:3b-instruct

runtime:
  # Fase 1: la ruta conversacional debe tener prioridad exclusiva. Los ciclos
  # autónomos se reactivarán después de demostrar el circuito chat completo.
  always_on: false
  mode: full_local_guarded
  interval_seconds: 60
  start_delay_seconds: 3
  max_cycles: 0
  require_ollama: false
  safe_only: true
  self_test_on_start: true
  self_test_every_cycles: 5
  workers_always_on: false
  workers_autostart: false
  workers_watchdog: false
  worker_mode: full_local_guarded
  # Creadora -> Formadora -> Educadora -> evidencia -> promoción gobernada.
  continuous_runner_enabled: false
  continuous_runner_autonomy_level: promote_stable
  continuous_runner_interval_seconds: 60
  continuous_runner_max_cycles: 0
  synthetic_canary_enabled: false
  live_runtime:
    heartbeat_interval_seconds: 5
    health_check_interval_seconds: 15
    scheduler_interval_seconds: 20
    light_background_interval_seconds: 60
    neuron_learning_interval_seconds: 180
    deep_research_interval_seconds: 1200
    evaluation_interval_seconds: 1800
    consolidation_interval_seconds: 3600
    heartbeat_jitter_seconds: 0.1
    scheduler_jitter_seconds: 1.0

hardware_profiles:
  target_32ram_24vram:
    max_parallel_cpu_workers: 4
    max_parallel_io_workers: 6
    max_parallel_model_workers: 1
    max_parallel_embedding_workers: 1
    reserved_system_ram_gb: 6
    reserved_interactive_ram_gb: 4
    reserved_vram_gb: 3
    soft_vram_limit_percent: 82
    hard_vram_limit_percent: 92
    thermal_soft_limit_c: 78
    thermal_hard_limit_c: 85

workers:
  runtime: 1
  scheduler: 1
  memory: 1
  research_io: 2
  neuron_education: 1
  evaluation: 1
  model_inference: 1
  maintenance: 1

semaphores:
  gpu_heavy: 1
  gpu_light: 1
  database_writer: 1
  deep_research: 2
  model_install: 1
  backup: 1

activity_budget:
  heartbeat:
    unlimited: true
  health_checks:
    max_per_minute: 6
  light_tasks:
    max_per_hour: 60
  model_inferences:
    max_per_hour: 40
  research_tasks:
    max_per_hour: 8
    max_per_day: 60
  deep_evaluations:
    max_per_hour: 2
    max_per_day: 16
  neuron_lessons:
    max_per_hour: 4
    max_per_day: 30
  backups:
    max_per_day: 2

runtime_budget:
  cpu_minutes_daily: 600
  gpu_minutes_daily: 360
  network_mb_daily: 1500
  new_storage_mb_daily: 500
  research_tasks_daily: 40
  deep_evaluations_daily: 12
  model_installs_daily: 1

metabolism:
  # Fase 1: no ejecutar metabolismo durante la recuperación conversacional.
  enabled: false
  dry_run: false
  mode: full
  interval_seconds: 15
  max_cycles: 0
  jitter_seconds: 2.0
  policy:
    min_priority: 10
    max_concurrent_needs: 5
    require_ollama: false
    require_redis: false
    allowed_modes:
      - observe_only
      - light
      - full
  needs:
    health_check:
      enabled: true
      interval_seconds: 30
      priority: 90
    heartbeat:
      enabled: true
      interval_seconds: 5
      priority: 80
    lease_supervision:
      enabled: true
      interval_seconds: 60
      priority: 70
    budget_check:
      enabled: true
      interval_seconds: 120
      priority: 60

triadeos:
  enabled: true
  knowledge_graph:
    enabled: true
  event_engine:
    enabled: true
    scan_interval_seconds: 60
  scheduler:
    enabled: true
    max_wakeups_per_cycle: 5
  conservative:
    min_confidence_to_consolidate: 0.70
    max_consolidations_per_cycle: 3
